services:
  # PostgreSQL - FHIR R4 + HIPAA Audit Data
  postgres:
    image: postgres:16-alpine
    container_name: ai-hos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fhir_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fhir_audit"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai-hos-network

  # MongoDB - Unstructured Clinical Notes (optional)
  mongodb:
    image: mongo:7.0
    container_name: ai-hos-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
    networks:
      - ai-hos-network

  # Redis - Caching & Sessions
  redis:
    image: redis:7-alpine
    container_name: ai-hos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - ai-hos-network

  # Ollama - Local LLM (optional; works on CPU or GPU)
  ollama:
    image: ollama/ollama:latest
    container_name: ai-hos-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-hos-network

  # MinIO - S3-Compatible Audio & Document Storage
  minio:
    image: minio/minio:latest
    container_name: ai-hos-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ai-hos-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  ollama_data:
  minio_data:

networks:
  ai-hos-network:
    name: ai-hos-network
    driver: bridge
